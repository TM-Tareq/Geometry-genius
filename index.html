<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Gem</title>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <header class="m-8">

    </header>
    <main>
        <!-- main content container -->

        <div class="flex flex-col md:flex-row">
            <!-- shape card container -->
            <div class="flex-1 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3">
                <!-- Triangel card 1-->
                <div class="card bg-base-100 w-96 shadow-sm">
                    <figure>
                      <img
                        src="images/triangle.png"
                        alt="Triangle" />
                    </figure>
                    <div class="card-body">
                      <h2 class="card-title">Triangle</h2>
                      <p class="text-center">Area (A) = 0.5 X b X h</p>
                      <div>
                        <input id="triangle-base" class="w-24 text-2xl p-2 rounded-sm" type="text" placeholder="b">
                        <span class="mr-4 ml-2">cm</span>
                        <input id="triangle-height" class="w-24 text-2xl p-2 rounded-sm" type="text" placeholder="h">
                        <span>cm</span>
                      </div>
                      <div>
                        <p class="text-2xl">Area: <span id="triangle-area"></span> <span>cm<sup>2</sup></span></p>
                      </div>
                      <div class="card-actions">
                        <button onclick="calculateTriangleArea()" class="btn btn-primary w-full">Calculate</button>
                      </div>
                    </div>
                  </div>
                <!-- Rectangle card 2-->
                <div class="card bg-base-100 w-96 shadow-sm">
                    <figure>
                      <img
                        src="images/rectangle.png"
                        alt="Rectangle" />
                    </figure>
                    <div class="card-body">
                      <h2 class="card-title">Rectangular</h2>
                      <p>Area (A) = w X l</p>
                      <div class="flex">
                        <!-- rectangle length -->
                        <input id="rectangle-length" class="w-24 text-2xl p-2 rounded-sm" type="text" name="" id="" placeholder="length">
                        <span class="mr-4 ml-2">cm</span>
                        <!-- rectangle width -->
                        <input id="rectangle-width" class="w-24 text-2xl p-2 rounded-sm" type="text" name="" id="" placeholder="width">
                        <span>cm</span>
                      </div>
                      <div>
                        <p class="text-2xl">Area: <span id="rectangle-area">0 </span><span>cm<sup>2</sup></span></p>
                      </div>
                      <div onclick="calculateRectangleArea()" class="card-actions justify-end">
                        <button class="btn btn-primary w-full">Calculate</button>
                      </div>
                    </div>
                  </div>
                <!-- Parallelogram card 3-->
                <div class="card bg-base-100 w-96 shadow-sm">
                    <figure>
                      <img
                        src="images/parallelogram.png"
                        alt="parallelogram" />
                    </figure>
                    <div class="card-body">
                      <h2 class="card-title">Parallelogram</h2>
                      <p class="text-2xl">Area (A) = b X h</p>
                      <div>
                        <input id="parallelogram-base" class="w-24 text-2xl p-2 rounded-sm" type="text" name="" id="" placeholder="base">
                        <span class="mr-4 ml-2">cm</span>
                        <input id="parallelogram-height" class="w-24 text-2xl p-2 rounded-sm" type="text" name="" id="" placeholder="height">
                        <span>cm</span>
                      </div>
                      <div>
                        <p>Area: <span id="parallelogram-area"></span> <span>cm<sup>2</sup></span></p>
                      </div>
                      <div class="card-actions justify-end">
                        <button onclick="calculateParallelogramArea()" class="btn btn-primary w-full">Calculate</button>
                      </div>
                    </div>
                  </div>
                <!-- Rhombus card 4-->
                <div class="card bg-base-100 w-96 shadow-sm">
                    <figure>
                      <img
                        src="images/rhombus.png"
                        alt="Rhombus" />
                    </figure>
                    <div class="card-body">
                      <h2 class="card-title">Rhombus</h2>
                      <p class="text-2xl">Area (A) = 0.5 X d<sub>1</sub> X d<sub>2</sub></p>
                      <div>
                        <input id="rhombus-d1" class="w-24 text-2xl p-2 rounded-sm" type="text" name="" placeholder="base">
                        <span class="mr-4 ml-2">cm</span>
                        <input id="rhombus-d2" class="w-24 text-2xl p-2 rounded-sm" type="text" name="" placeholder="height">
                        <span>cm</span>
                      </div>
                      <div>
                        <p>Area: <span id="rhombus-area"></span> <span>cm<sup>2</sup></span></p>
                      </div>
                      <div class="card-actions justify-end">
                        <button onclick="calculateRhombusArea()" class="w-full btn btn-primary">Calculate</button>
                      </div>
                    </div>
                  </div>
                <!-- Pentagon card 5-->
                <div class="card bg-base-100 w-96 shadow-sm">
                    <figure>
                      <img
                        src="images/pentagon.png"
                        alt="pentagon" />
                    </figure>
                    <div class="card-body">
                      <h2 class="card-title">Pentagon</h2>
                      <p class="text-2xl">Area: 0.5 X p X b</p>
                      <div class="flex gap-5">
                        <input class="w-24 text-2xl p-2 rounded-sm" type="text" name="" id="pentagon-perimeter" placeholder="p">
                        <input class="w-24 text-2xl p-2 rounded-sm" type="text" name="" id="pentagon-apothe" placeholder="b">
                      </div>
                      <div>
                        <p>Area: <span id="pentagon-area">0</span></p>
                      </div>
                      <div class="card-actions justify-end">
                        <button onclick="calculatePentagonArea()" class="w-full btn btn-primary">Calculate</button>
                      </div>
                    </div>
                  </div>
                <!-- Ellipse card 6-->
                <div class="card bg-base-100 w-96 shadow-sm">
                    <figure>
                      <img
                        src="images/ellipse.png"
                        alt="ellipse" />
                    </figure>
                    <div class="card-body">
                      <h2 class="card-title">Ellipse</h2>
                      <p class="text-2xl">Area: π X p X b</p>
                      <div class="flex gap-5">
                        <input class="w-24 text-2xl p-2 rounded-sm" type="text" name="" id="ellipse-major-radius" placeholder="p">
                        <input class="w-24 text-2xl p-2 rounded-sm" type="text" name="" id="ellipse-minor-radius" placeholder="b">
                      </div>
                      <div>
                        <p>Area: <span id="ellipse-area">0</span></p>
                      </div>
                      <div class="card-actions justify-end">
                        <button onclick="calculateEllipseArea()" class="w-full btn btn-primary">Calculate</button>
                      </div>
                    </div>
                  </div>
            </div>

            <!-- Area calculation container -->
            <!-- <div class="w-96 border-2 border-gray-700 rounded-md">
                <h3 class="text-3xl text-center p-4">Area Calculation</h3>
            </div> -->
        </div>
    </main>


    <script src="scripts/triangle-calculate.js"></script>
    <script src="scripts/rectangle-area.js"></script>
    <script src="scripts/parallelogram-area.js"></script>
    <script src="scripts/pentagon-area.js"></script>
    <script src="scripts/ellipse-area.js"></script>
    <script src="scripts/rhombus-area.js"></script>
</body>
</html>
